<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>DeviceLog - Device Details</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#e9edf2;
    color:#18212f;
}

.phone{
    width:390px;
    height:844px;
    margin:20px auto;
    background:#f5f7fa;
    border-radius:35px;
    overflow:hidden;
    position:relative;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.app{
    height:100%;
    overflow-y:auto;
    padding-bottom:90px;
}

.app::-webkit-scrollbar{
    width:0;
}


/* =========================================
   HEADER
========================================= */

.header{
    background:#fff;
    padding:22px 20px;
    border-bottom:1px solid #e8ebef;
}

.header-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f1f4f7;
    font-size:21px;
    cursor:pointer;
}

.header h1{
    font-size:20px;
}


/* =========================================
   CONTENT
========================================= */

.content{
    padding:20px;
}


/* =========================================
   DEVICE HERO
========================================= */

.device-hero{
    background:#fff;
    border:1px solid #e4e8ee;
    border-radius:20px;
    padding:25px 20px;
    text-align:center;
    margin-bottom:16px;
}

.device-big-icon{
    width:80px;
    height:80px;
    margin:0 auto 15px;
    border-radius:22px;
    background:#edf5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.device-hero h2{
    font-size:22px;
    margin-bottom:7px;
    word-break:break-word;
}

.device-hero p{
    font-size:12px;
    color:#8792a2;
}


/* =========================================
   STATUS
========================================= */

.status{
    display:inline-block;
    margin-top:13px;
    padding:7px 12px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
}

.working{
    background:#eaf8ef;
    color:#23944c;
}

.repair{
    background:#fff7df;
    color:#b27a00;
}

.not-working{
    background:#fff0f0;
    color:#d43b3b;
}


/* =========================================
   DETAILS CARD
========================================= */

.details-card{
    background:#fff;
    border:1px solid #e4e8ee;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:16px;
}

.card-title{
    padding:17px 18px;
    font-size:15px;
    font-weight:700;
    border-bottom:1px solid #edf0f3;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 18px;
    border-bottom:1px solid #edf0f3;
}

.detail-row:last-child{
    border-bottom:none;
}

.detail-label{
    font-size:11px;
    color:#8792a2;
}

.detail-value{
    font-size:12px;
    font-weight:600;
    text-align:right;
    max-width:55%;
    word-break:break-word;
}


/* =========================================
   BUTTONS
========================================= */

.actions{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.edit-btn,
.delete-btn{
    width:100%;
    height:46px;
    border-radius:11px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.edit-btn{
    border:none;
    background:#287be8;
    color:#fff;
}

.delete-btn{
    border:1px solid #f0caca;
    background:#fff;
    color:#d43b3b;
}

.edit-btn:active,
.delete-btn:active{
    transform:scale(.98);
}


/* =========================================
   NOT FOUND
========================================= */

.not-found{
    background:#fff;
    border:1px dashed #d9dfe7;
    border-radius:16px;
    padding:35px 20px;
    text-align:center;
}

.not-found-icon{
    font-size:40px;
    margin-bottom:12px;
}

.not-found h2{
    font-size:17px;
    margin-bottom:7px;
}

.not-found p{
    color:#8792a2;
    font-size:12px;
    line-height:1.5;
    margin-bottom:18px;
}

.back-devices{
    display:inline-block;
    background:#287be8;
    color:#fff;
    text-decoration:none;
    padding:11px 18px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:rgba(255,255,255,.97);
    border-top:1px solid #e4e8ee;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:5px 8px;
}

.nav-item{
    width:65px;
    height:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-decoration:none;
    color:#8994a3;
    font-size:10px;
    border-radius:12px;
}

.nav-item span:first-child{
    font-size:19px;
}

.nav-item.active{
    color:#287be8;
    background:#edf5ff;
    font-weight:600;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:430px){

    body{
        background:#f5f7fa;
    }

    .phone{
        width:100%;
        height:100vh;
        margin:0;
        border-radius:0;
        box-shadow:none;
    }

}


/* =========================================
   DARK MODE
========================================= */
body.dark{background:#0f172a;color:#f1f5f9}
body.dark .phone{background:#111827;box-shadow:0 10px 35px rgba(0,0,0,.35)}
body.dark .header{background:#1f2937;border-bottom-color:#374151}
body.dark .header h1{color:#f8fafc}
body.dark .back{background:#374151;color:#f8fafc}
body.dark .device-hero,
body.dark .details-card{background:#1f2937;border-color:#374151}
body.dark .device-big-icon{background:#1e3a5f}
body.dark .device-hero p,
body.dark .detail-label{color:#94a3b8}
body.dark .card-title{border-bottom-color:#374151;color:#f8fafc}
body.dark .detail-row{border-bottom-color:#374151}
body.dark .detail-value{color:#f8fafc}
body.dark .delete-btn{background:#1f2937;border-color:#7f1d1d;color:#fca5a5}
body.dark .not-found{background:#1f2937;border-color:#475569}
body.dark .not-found h2{color:#f8fafc}
body.dark .not-found p{color:#94a3b8}
body.dark .bottom-nav{background:#1f2937;border-top-color:#374151}
body.dark .nav-item{color:#94a3b8}
body.dark .nav-item.active{color:#60a5fa;background:#1e3a5f}
@media(max-width:430px){body.dark{background:#111827}}

</style>

</head>


<body>

<div class="phone">

<div class="app">


<!-- ======================================
     HEADER
======================================= -->

<header class="header">

    <div class="header-top">

        <button
            class="back"
            onclick="goBack()">

            ‹

        </button>

        <h1>Device Details</h1>

    </div>

</header>


<main class="content">

    <!-- DEVICE INFORMATION WILL LOAD HERE -->

    <div id="deviceContainer"></div>

</main>

</div>


<!-- ======================================
     BOTTOM NAV
======================================= -->

<nav class="bottom-nav">

    <a
        href="home.html"
        class="nav-item">

        <span>⌂</span>
        <span>Home</span>

    </a>


    <a
        href="device-list.html"
        class="nav-item active">

        <span>💻</span>
        <span>Devices</span>

    </a>


    <a
        href="stats.html"
        class="nav-item">

        <span>📊</span>
        <span>Stats</span>

    </a>


    <a
        href="settings.html"
        class="nav-item">

        <span>⚙️</span>
        <span>Settings</span>

    </a>

</nav>

</div>


<script>


/* =========================================
   DARK MODE
========================================= */
function loadDarkMode(){
    const darkMode=localStorage.getItem("devicelog_darkmode")==="true";
    document.body.classList.toggle("dark",darkMode);
}

/* =========================================
   GET SELECTED DEVICE
========================================= */

function getSelectedDevice(){

    const selectedId =
        localStorage.getItem(
            "selected_device_id"
        );


    if(!selectedId){
        return null;
    }


    let devices = [];


    try{

        const saved =
            localStorage.getItem(
                "devicelog_devices"
            );


        if(saved){

            devices =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "Error loading devices:",
            error
        );

        return null;

    }


    if(!Array.isArray(devices)){
        return null;
    }


    return devices.find(function(device){

        return device.id === selectedId;

    }) || null;

}


/* =========================================
   STATUS CLASS
========================================= */

function statusClass(status){

    if(status === "Working"){
        return "working";
    }

    if(status === "Under Repair"){
        return "repair";
    }

    return "not-working";
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(char){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"
                }[char];

            }
        );
}


/* =========================================
   LOAD DEVICE
========================================= */

function loadDevice(){

    const container =
        document.getElementById(
            "deviceContainer"
        );


    const device =
        getSelectedDevice();


    /* DEVICE NOT FOUND */

    if(!device){

        container.innerHTML = `

            <div class="not-found">

                <div class="not-found-icon">
                    🔍
                </div>

                <h2>
                    Device Not Found
                </h2>

                <p>
                    The selected device could
                    not be found. Please return
                    to your Devices list.
                </p>

                <a
                    href="device-list.html"
                    class="back-devices">

                    Back to Devices

                </a>

            </div>

        `;

        return;
    }


    /* DEVICE DETAILS */

    container.innerHTML = `

        <section class="device-hero">

            <div class="device-big-icon">
                ${device.icon || "💻"}
            </div>

            <h2>
                ${escapeHtml(device.name)}
            </h2>

            <p>
                ${escapeHtml(device.type)}
                •
                ${escapeHtml(device.brand)}
            </p>

            <span
                class="status ${statusClass(device.status)}">

                ${escapeHtml(device.status)}

            </span>

        </section>


        <section class="details-card">

            <div class="card-title">
                Device Information
            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Device Name
                </span>

                <span class="detail-value">
                    ${escapeHtml(device.name)}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Device Type
                </span>

                <span class="detail-value">
                    ${escapeHtml(device.type)}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Brand
                </span>

                <span class="detail-value">
                    ${escapeHtml(device.brand)}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Status
                </span>

                <span class="detail-value">
                    ${escapeHtml(device.status)}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Device ID
                </span>

                <span class="detail-value">
                    ${escapeHtml(device.id)}
                </span>

            </div>

        </section>


        <div class="actions">

            <button
                class="edit-btn"
                onclick="editDevice()">

                ✏️ Edit Device

            </button>


            <button
                class="delete-btn"
                onclick="deleteDevice()">

                🗑️ Delete Device

            </button>

        </div>

    `;

}


/* =========================================
   BACK
========================================= */

function goBack(){

    window.location.href =
        "device-list.html";

}


/* =========================================
   EDIT DEVICE
========================================= */
function editDevice(){

    window.location.href =
        "edit-device.html";

}


/* =========================================
   DELETE DEVICE
========================================= */

function deleteDevice(){

    const device =
        getSelectedDevice();


    if(!device){

        alert(
            "Device not found."
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete " +
            device.name +
            "?"
        );


    if(!confirmed){
        return;
    }


    let devices = [];


    try{

        const saved =
            localStorage.getItem(
                "devicelog_devices"
            );


        if(saved){

            devices =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(error);

        alert(
            "Unable to delete device."
        );

        return;

    }


    devices =
        devices.filter(function(item){

            return item.id !== device.id;

        });


    /* SAVE UPDATED LIST */

    localStorage.setItem(
        "devicelog_devices",
        JSON.stringify(devices)
    );


    /* REMOVE SELECTED DEVICE */

    localStorage.removeItem(
        "selected_device_id"
    );


    /* RETURN TO DEVICES */

    window.location.href =
        "device-list.html";

}


/* =========================================
   START
========================================= */

loadDarkMode();
loadDevice();

window.addEventListener("pageshow", function(){
    loadDarkMode();
});

window.addEventListener("storage", function(){
    loadDarkMode();
});

</script>

</body>

</html>
